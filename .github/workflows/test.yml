name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs: ["29.1", "30.1", "31.1", snapshot]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit: the first with Emacs 31.1, which no tag has yet.
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs }}
      - run: make deps check

  # Real launchd jobs; GitHub's macOS runners have a login session.
  integration-launchd:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: "30.1"
      - run: make integration

  # MELPA's own checks, from https://github.com/riscy/melpazoid.
  melpazoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get install emacs && emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
      - name: Run
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: (mu4e-send-later :fetcher github :repo "Jotham-LEC/mu4e-send-later")
          # Warnings are checked below instead, all but one of them fatal.
          WARN_IS_ERROR: false
          # Not on MELPA yet.
          EXIST_OK: false
        # melpazoid warns that a package named mu4e-* should require mu4e,
        # but mu4e ships with mu and is on no package archive, so nothing
        # could install it; mu4e packages on MELPA leave it out too.  Any
        # other warning still fails the job.
        run: |
          set -o pipefail
          echo "$GITHUB_REF"
          make -C ~/melpazoid 2>&1 | tee melpazoid.log
          if grep $'\e\\[33m' melpazoid.log | grep -v 'does not depend on `mu4e`'; then
            echo "melpazoid warned" >&2
            exit 1
          fi
